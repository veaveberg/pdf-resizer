name: Build Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-apps-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: "v1"

      - name: Prepare portable Ghostscript runtime (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install ghostscript
          GS_PREFIX="$(brew --prefix ghostscript)"
          GS_BIN="$(command -v gs || true)"
          python3 scripts/prepare_macos_ghostscript_runtime.py \
            --brew-prefix "$GS_PREFIX" \
            --gs-bin "$GS_BIN" \
            --output-root src-tauri/bin/ghostscript

      - name: Prepare Ghostscript runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install ghostscript -y
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          Remove-Item -Recurse -Force src-tauri/bin/ghostscript-win -ErrorAction SilentlyContinue
          $gsRoot = Get-ChildItem "C:\Program Files\gs\gs*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $gsRoot) { throw "Ghostscript installation folder not found." }
          Copy-Item $gsRoot.FullName "src-tauri/bin/ghostscript-win" -Recurse -Force

      - name: install frontend dependencies
        run: npm ci

      - name: Clean stale bundled Ghostscript outputs
        if: matrix.platform == 'macos-latest'
        run: |
          rm -rf src-tauri/target/release/bin/ghostscript src-tauri/target/release/bin/ghostscript-win

      - name: Clean stale bundled Ghostscript outputs (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "src-tauri/target/release/bin/ghostscript" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "src-tauri/target/release/bin/ghostscript-win" -ErrorAction SilentlyContinue

      - name: Build Tauri bundles
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Smoke test bundled Ghostscript (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          APP_PATH=$(find \
            "src-tauri/target/${{ matrix.target }}/release/bundle" \
            "src-tauri/target/release/bundle" \
            -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "macOS app bundle not found"
            find "src-tauri/target" -maxdepth 6 -type d 2>/dev/null | sort || true
            exit 1
          fi
          GS_BIN="$APP_PATH/Contents/Resources/bin/ghostscript/bin/gs"
          if [ ! -x "$GS_BIN" ]; then
            echo "Bundled Ghostscript binary not found at: $GS_BIN"
            find "$APP_PATH/Contents/Resources" -maxdepth 5 -type f | sort || true
            exit 1
          fi
          python3 scripts/ghostscript_smoke.py \
            --gs "$GS_BIN" \
            --gs-root "$APP_PATH/Contents/Resources/bin/ghostscript"

      - name: Smoke test NSIS installer (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/${{ matrix.target }}/release"
          $artifactDir = "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $installer = Get-ChildItem "$releaseDir/bundle/nsis/*-setup.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Tauri NSIS installer not found." }

          $installDir = "$env:TEMP\\pdfresizer-smoke-install"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          & $installer.FullName /S "/D=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer exited with code $LASTEXITCODE" }

          $resolvedInstallDir = $installDir
          $installedGs = Get-ChildItem $resolvedInstallDir -Filter gswin64c.exe -File -Recurse | Select-Object -First 1
          if (-not $installedGs) {
            throw "Installed Ghostscript binary not found under $resolvedInstallDir."
          }
          $installedGsRoot = Split-Path (Split-Path $installedGs.FullName -Parent) -Parent
          python scripts/ghostscript_smoke.py --gs "$($installedGs.FullName)" --gs-root "$installedGsRoot"

          $uninstaller = "$resolvedInstallDir\\uninstall.exe"
          if (Test-Path $uninstaller) {
            & $uninstaller /S
          }

          Copy-Item $installer.FullName "$artifactDir/PDF-Resizer-Windows.exe" -Force

      - name: Prepare DMG artifact (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p artifacts
          DMG_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name "*.dmg" -type f | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "DMG artifact not found"
            exit 1
          fi
          cp "$DMG_PATH" "artifacts/PDF-Resizer-macOS.dmg"

      - name: Upload macOS artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Resizer-macOS
          if-no-files-found: error
          path: "artifacts/PDF-Resizer-macOS.dmg"

      - name: Upload Windows artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Resizer-Windows
          if-no-files-found: error
          path: "artifacts/PDF-Resizer-Windows.exe"

  publish_release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: artifacts

      - name: Publish assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PDF-Resizer-macOS.dmg
            artifacts/PDF-Resizer-Windows.exe
